version: '0.1.0'
config:
  testRunner:
    command: npm run test
    args:
      filter: --grep
      tap: --reporter=mocha-tap-reporter
    directory: coderoad
  repo:
    uri: https://github.com/your-username/mcp-tutorial
    branch: v0.1.0
  dependencies:
    - name: Install Node packages
      command: npm install
  setup:
    commands:
      - npm install
    commits:
      - INIT

levels:
  - id: '1'
    steps:
      - id: '1.1'
        setup:
          commands:
            - echo "Witaj w tutorialu MCP!"
          commits:
            - '1.1'
      - id: '1.2'
        setup:
          commits:
            - '1.2'
      - id: '1.3'
        setup:
          commits:
            - '1.3'
  - id: '2'
    steps:
      - id: '2.1'
        setup:
          commits:
            - '2.1'
      - id: '2.2'
        setup:
          commits:
            - '2.2'
      - id: '2.3'
        setup:
          commits:
            - '2.3'
  - id: '3'
    steps:
      - id: '3.1'
        setup:
          commits:
            - '3.1'
      - id: '3.2'
        setup:
          commits:
            - '3.2'
      - id: '3.3'
        setup:
          commits:
            - '3.3'
